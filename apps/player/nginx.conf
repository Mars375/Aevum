server {
  listen 80;
  # Bind IPv6 too, so a container resolving localhost to ::1 still reaches us.
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The player is a static SPA; every unknown path falls back to it.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Replays are mounted read-only and change without a rebuild, so they must not
  # be cached as aggressively as the fingerprinted bundle.
  location /replays/ {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  gzip on;
  gzip_types application/json application/javascript text/css;
}
