<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Aevum : une case du monde, partagée entre les quatre civilisations,
       qu'un pacte relie. Mêmes couleurs que le jeu (CIV_COLORS). -->
  <rect width="256" height="256" rx="52" fill="#1c2f28"/>
  <g transform="translate(128 146)">
    <!-- Le socle de la case, vue isométrique -->
    <path d="M0 48 L-88 4 L-88 20 L0 64 L88 20 L88 4 Z" fill="#12211c"/>
    <!-- Quatre quartiers : nord ambre, est azur, sud sylve, ouest pourpre -->
    <path d="M0 -40 L44 -18 L0 4 L-44 -18 Z" fill="#e0b45c"/>
    <path d="M44 -18 L88 4 L44 26 L0 4 Z" fill="#78b6ee"/>
    <path d="M0 4 L44 26 L0 48 L-44 26 Z" fill="#83ba91"/>
    <path d="M-44 -18 L0 4 L-44 26 L-88 4 Z" fill="#e58d83"/>
    <path d="M0 -40 L88 4 L0 48 L-88 4 Z" fill="none" stroke="#0e1a16" stroke-width="3" stroke-linejoin="round"/>
    <path d="M44 -18 L-44 26 M-44 -18 L44 26" stroke="#0e1a16" stroke-width="2" opacity=".45"/>
    <!-- Le pacte : un arc d'or qui relie deux quartiers -->
    <path d="M-44 -18 Q0 -118 44 -18" fill="none" stroke="#ffd978" stroke-width="9" stroke-linecap="round"/>
    <circle cx="0" cy="-68" r="9" fill="#fff6d8"/>
  </g>
</svg>
