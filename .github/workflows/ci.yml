name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the event diff for API keys
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git hash-object -t tree /dev/null)"
          fi

          diff_file="$(mktemp)"
          trap 'rm -f "$diff_file"' EXIT
          if ! git diff --no-ext-diff --unified=0 "$base" "$HEAD_SHA" -- >"$diff_file"; then
            echo "::error::Could not generate the event diff."
            exit 1
          fi

          if grep -qE "sk-or-v1-[A-Za-z0-9_-]{20,}|gsk_[A-Za-z0-9_-]{20,}|nvapi-[A-Za-z0-9_-]{20,}|MISTRAL_API_KEY[[:space:]]*=[[:space:]]*[\"']?[A-Za-z0-9_-]{20,}" "$diff_file"; then
            echo "::error::An API key pattern appears in the event diff."
            exit 1
          fi

      - name: Ensure .env stays ignored and untracked
        run: |
          if ! git check-ignore -q .env; then
            echo "::error::.env is not ignored by git."
            exit 1
          fi
          if git ls-files --error-unmatch -- .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run player:build
      - name: Validate the Aevum Compose deployment
        run: docker compose config --quiet
      - run: npm run healthcheck
      - name: Probe the continuous world offline
        run: npm run world:probe -- 300
      - name: Rebuild the report catalogue
        run: npm run build-reports
