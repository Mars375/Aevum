name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the event diff for API keys
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git hash-object -t tree /dev/null)"
          fi

          diff_file="$(mktemp)"
          trap 'rm -f "$diff_file"' EXIT
          if ! git diff --no-ext-diff --unified=0 "$base" "$HEAD_SHA" -- >"$diff_file"; then
            echo "::error::Could not generate the event diff."
            exit 1
          fi

          if grep -qiE "sk-or-v1-[A-Za-z0-9_-]{20,}|gsk_[A-Za-z0-9_-]{20,}|nvapi-[A-Za-z0-9_-]{20,}|(OPENROUTER|GROQ|NVIDIA|MISTRAL)_API_KEY[[:space:]]*[:=][[:space:]]*[\"']?[A-Za-z0-9_./+-]{20,}" "$diff_file"; then
            echo "::error::An API key pattern appears in the event diff."
            exit 1
          fi

      - name: Ensure .env stays ignored and untracked
        run: |
          if ! git check-ignore -q .env; then
            echo "::error::.env is not ignored by git."
            exit 1
          fi
          if git ls-files --error-unmatch -- .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git."
            exit 1
          fi
          if [ -e .env ] && [ "$(stat -c '%a' .env)" != "600" ]; then
            echo "::error::.env permissions must be 600."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run player:build
      - name: Run clone healthcheck (provider access is advisory)
        run: npm run healthcheck
      - name: Probe the continuous world offline
        run: npm run world:probe -- 300
      - name: Rebuild the Season 1 methodology report
        run: npm run season-report -- worlds/aevum-season-1/era-0001.json worlds/aevum-season-1/era-0001.learning.json --out=docs/reports/aevum-season-1.md
      - name: Rebuild the report catalogue
        run: npm run build-reports
      - name: Rebuild the world catalogue
        run: npm run index-worlds
      - name: Verify the Season 1 release candidate
        run: npm run verify-season-1
      - name: Reject stale committed reports and indexes
        run: |
          git diff --check
          git diff --exit-code -- docs/reports worlds/index.json apps/player/public/reports apps/player/public/worlds
      - name: Build and smoke-test the Aevum Compose deployment
        run: |
          set -euo pipefail
          trap 'docker compose down --remove-orphans --volumes' EXIT
          docker compose config --quiet
          docker compose up --detach --build
          container="$(docker compose ps -q player)"
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container" 2>/dev/null || true)"
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && { docker compose logs; exit 1; }
            sleep 2
          done
          [ "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy ]
          for path in / /reports/aevum-season-1.html /reports/aevum-season-1-verification.html /reports/index.json /worlds/index.json /worlds/aevum-season-1/era-0001.json /worlds/aevum-season-1/era-0001.learning.json; do
            curl --fail --silent --show-error "http://127.0.0.1:8088$path" >/dev/null
          done
      - name: Record dependency advisories
        continue-on-error: true
        run: npm audit --audit-level=high
